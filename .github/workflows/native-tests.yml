name: Native tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderer and controls with ASan and UBSan
        env:
          CXX: clang++
        run: ./tools/test.sh
      - name: Script syntax
        run: |
          bash -n build.sh build-xip.sh upload.sh upload-xip.sh tools/setup-xip.sh tools/test.sh tools/package-release.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('tools').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
